name: Pi compatibility

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      official-version:
        description: Official stable version resolved for this run; blank resolves latest
        type: string
        default: ""
      fork-ref:
        description: Maintained fork commit resolved for this run; blank resolves main
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use the repository package manager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - name: Enforce the canonical acceptance workflow
        run: npm run ci

  compatibility:
    uses: fitchmultz/.github/.github/workflows/pi-compatibility.yml@508d2e23c75cab8fdd28bc62fc7fed2a9a0d1cca # main
    with:
      automation-ref: 508d2e23c75cab8fdd28bc62fc7fed2a9a0d1cca # main
      official-version: ${{ inputs.official-version }}
      fork-ref: ${{ inputs.fork-ref }}
